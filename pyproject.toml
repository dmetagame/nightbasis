[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightbasis"
version = "0.1.0"
description = "Data audit for the NightBasis Bitget rToken strategy"
requires-python = ">=3.10"

[project.scripts]
nightbasis = "nightbasis.audit_data:main"

[tool.setuptools.packages.find]
where = ["src"]
